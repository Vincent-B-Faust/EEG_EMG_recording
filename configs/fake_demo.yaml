# Hardware-free demo with an intentionally flexible five-channel layout.
project:
  output_root: ../runs/fake_demo
  session_name: fake_sleep_demo
  mouse_ids:
    - Mouse01
    - Mouse02

acquisition:
  backend: fake
  device: synthetic
  sample_rate_hz: 500
  block_duration_s: 0.1
  duration_s: 20
  terminal_config: DIFF
  input_range_v: [-10.0, 10.0]
  read_timeout_s: 10.0
  start_trigger:
    enabled: false
    source: ""
    edge: rising
  channels:
    - name: Mouse01_EEG
      mouse_id: Mouse01
      role: EEG
      physical_channel: ai0
      enabled: true
      amplifier_gain: 1000
      amplifier_model: Synthetic DAM50
      amplifier_serial: FAKE-EEG-01
      amplifier_mode: AC
      hardware_filter_enabled: true
      hardware_highpass_hz: 0.1
      hardware_lowpass_hz: 100
      hardware_notch_enabled: false
      hardware_notch_hz: null
      amplifier_settings_verified: true
      amplifier_notes: Fake demo metadata only
      color: "#20A4F3"
    - name: Mouse01_EMG
      mouse_id: Mouse01
      role: EMG
      physical_channel: ai1
      enabled: true
      amplifier_gain: 1000
      amplifier_model: Synthetic DAM50
      amplifier_serial: FAKE-EMG-01
      amplifier_mode: AC
      hardware_filter_enabled: true
      hardware_highpass_hz: 10
      hardware_lowpass_hz: 200
      hardware_notch_enabled: false
      hardware_notch_hz: null
      amplifier_settings_verified: true
      amplifier_notes: Fake demo metadata only
      color: "#F26430"
    - name: Mouse02_EEG
      mouse_id: Mouse02
      role: EEG
      physical_channel: ai2
      enabled: true
      amplifier_gain: 1000
      amplifier_model: Synthetic DAM50
      amplifier_serial: FAKE-EEG-02
      amplifier_mode: AC
      hardware_filter_enabled: true
      hardware_highpass_hz: 0.1
      hardware_lowpass_hz: 100
      hardware_notch_enabled: false
      hardware_notch_hz: null
      amplifier_settings_verified: true
      amplifier_notes: Fake demo metadata only
      color: "#8E5BD9"
    - name: Mouse02_EMG
      mouse_id: Mouse02
      role: EMG
      physical_channel: ai3
      enabled: true
      amplifier_gain: 1000
      amplifier_model: Synthetic DAM50
      amplifier_serial: FAKE-EMG-02
      amplifier_mode: AC
      hardware_filter_enabled: true
      hardware_highpass_hz: 10
      hardware_lowpass_hz: 200
      hardware_notch_enabled: false
      hardware_notch_hz: null
      amplifier_settings_verified: true
      amplifier_notes: Fake demo metadata only
      color: "#32A852"
    - name: Thermal_SYNC
      role: SYNC
      physical_channel: ai4
      enabled: true
      amplifier_gain: 1
      amplifier_model: Direct synthetic input
      amplifier_serial: ""
      amplifier_mode: OTHER
      hardware_filter_enabled: false
      hardware_highpass_hz: null
      hardware_lowpass_hz: null
      hardware_notch_enabled: false
      hardware_notch_hz: null
      amplifier_settings_verified: true
      amplifier_notes: No physical amplifier in fake mode
      color: "#E6B800"

preview:
  enabled: true
  history_s: 10
  refresh_hz: 10
  display_units: input_uv
  auto_scale: true
  notch_hz: 50
  notch_q: 30
  filter_display_only: true
  eeg_bandpass_hz: [0.5, 45]
  emg_bandpass_hz: [10, 200]
  window_width: 1200
  window_height: 720

storage:
  flush_interval_s: 0.5
  hdf5_compression: lzf
  csv_enabled: true
  csv_decimation: 10

sync:
  control_dir: null
  parent_session_dir: null
  analog_threshold_v: 2.5
  analog_edge: rising
  analog_start_match_enabled: false
  analog_start_match_channel: Thermal_SYNC
  analog_start_match_window_s: 1.0
