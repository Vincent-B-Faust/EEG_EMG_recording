  device: auto
  sample_rate_hz: 1000.0
  block_duration_s: 0.1
  duration_s: 20.0
  terminal_config: DIFF
  input_range_v:
  - -10.0
  - 10.0
  read_timeout_s: 10.0
  start_trigger:
    enabled: false
    source: /{device}/PFI0
    edge: rising
  channels:
  - name: Mouse01_EEG
    physical_channel: ai0
    role: EEG
    mouse_id: Mouse01
    enabled: true
    amplifier_gain: 1000.0
    amplifier_model: WPI DAM50
    amplifier_serial: ''
    amplifier_mode: AC
    hardware_highpass_hz: 0.1
    hardware_lowpass_hz: 1000.0
    hardware_filter_enabled: true
    hardware_notch_enabled: false
    hardware_notch_hz: null
    amplifier_settings_verified: false
    amplifier_notes: ''
    color: '#20A4F3'
    terminal_config: null
    input_min_v: null
    input_max_v: null
  - name: Mouse01_EMG
    physical_channel: ai1
    role: EMG
    mouse_id: Mouse01
    enabled: true
    amplifier_gain: 1000.0
    amplifier_model: WPI DAM50
    amplifier_serial: ''
    amplifier_mode: AC
    hardware_highpass_hz: 10.0
    hardware_lowpass_hz: 1000.0
    hardware_filter_enabled: true
    hardware_notch_enabled: false
    hardware_notch_hz: null
    amplifier_settings_verified: false
    amplifier_notes: ''
    color: '#F26430'
    terminal_config: null
    input_min_v: null
    input_max_v: null
preview:
  enabled: false
  history_s: 10.0
  refresh_hz: 10
  display_units: input_uv
  auto_scale: true
  notch_hz: null
  notch_q: 30
  filter_display_only: true
  eeg_bandpass_hz:
  - 0.5
  - 45
  emg_bandpass_hz:
  - 10
  - 200
  window_width: 1200
  window_height: 720
storage:
  flush_interval_s: 1.0
  hdf5_compression: lzf
  csv_enabled: false
  csv_decimation: 10
sync:
  control_dir: null
  parent_session_dir: null
  analog_threshold_v: 2.5
  analog_edge: rising
  analog_start_match_enabled: false
  analog_start_match_channel: ''
  analog_start_match_window_s: 1.0
