[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aki-eeg-emg-recording"
version = "0.1.0"
description = "Independent NI-DAQmx EEG/EMG recorder with live preview and thermal-session synchronization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "numpy>=1.22",
  "opencv-python>=4.7",
  "PyYAML>=6.0",
  "scipy>=1.9",
]

[project.optional-dependencies]
nidaq = ["nidaqmx>=1.0"]
test = ["pytest>=7.0"]

[project.scripts]
eeg-emg-recording = "eeg_emg_recording.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
